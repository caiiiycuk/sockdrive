name: build

on:
  push:
    branches: [ "v2" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "v2" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare
      run: ./test-assets/generate.sh
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Release rustup
      if: startsWith(github.ref, 'refs/tags/')
      run: rustup target add x86_64-unknown-linux-musl
    - name: Release Build
      if: startsWith(github.ref, 'refs/tags/')
      run: cargo build --all --release --target x86_64-unknown-linux-musl
    - name: Publish
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: ${{ github.ref_name }}
        files: |
          ${{github.workspace}}/target/x86_64-unknown-linux-musl/release/cli
          ${{github.workspace}}/target/x86_64-unknown-linux-musl/release/cli.d
