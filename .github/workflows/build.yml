name: build

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Prepare
      run: ./test-assets/generate.sh
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
